<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phoo K-pop & Thai-pop Shop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* WATERMARK REPEATING LOGO BACKGROUND */
    body {
      background-color: #faf5ff;
      background-image: repeating-linear-gradient(45deg, rgba(217, 70, 239, 0.04) 0, rgba(217, 70, 239, 0.04) 15px, transparent 0, transparent 50px),
                        url("data:image/svg+xml,%3Csvg width='140' height='140' viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='50%25' y='50%25' font-size='13' font-weight='900' fill='%23d946ef' opacity='0.12' dominant-baseline='middle' text-anchor='middle'%3E🛍️ PHOO SHOP%3C/text%3E%3C/svg%3E");
    }

    /* LIKE BUTTON STYLES */
    .like-box {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-top: 10px;
    }
    .btn-like {
      background: #ffe4e6; color: #e11d48; border: 2px solid #fecdd3;
      border-radius: 30px; padding: 6px 16px; font-weight: 800;
      cursor: pointer; font-size: 0.85rem; transition: 0.2s;
    }
    .btn-like.liked { background: #e11d48; color: white; border-color: #e11d48; }

    /* GAME SECTION STYLES */
    .game-card {
      background: #fff; border-radius: 20px; padding: 16px;
      border: 2px dashed #c084fc; margin-bottom: 20px; text-align: center;
    }
    .game-btn {
      background: #8b5cf6; color: white; border: none; padding: 8px 14px;
      border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.85rem;
    }

    /* REPORT SECTION STYLES */
    .report-card {
      background: #fff; border-radius: 20px; padding: 16px;
      border: 2px solid #fecdd3; margin-bottom: 20px;
    }
    
    /* RECEIPT LOGO BOX */
    .receipt-box {
      margin-top: 15px; padding: 15px; border: 2px dashed #d946ef;
      border-radius: 16px; background: #faf5ff; text-align: center;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- SHOP HEADER -->
    <header class="site-header">
      <div style="display:flex; align-items:center; justify-content:center; gap:10px;">
        <!-- LOGO ICON -->
        <div style="width:45px; height:45px; background:#d946ef; color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1.2rem;">PS</div>
        <div>
          <h1 class="shop-title">🛍️ Phoo Shop</h1>
          <p class="address">Phoo K-pop & Thai-pop Shop</p>
        </div>
      </div>

      <!-- DEVICE LIKE SYSTEM -->
      <div class="like-box">
        <button id="btn-heart" class="btn-like">❤️ အသည်းပေးမည်</button>
        <span id="like-count" style="font-weight:800; color:#e11d48; font-size:0.9rem;">0 Likes</span>
      </div>
    </header>

    <!-- MAIN SHOP CONTENT -->
    <main>
      <!-- BTS & BLACKPINK FAN MINI GAME -->
      <section class="game-card">
        <h3 style="font-size:1rem; font-weight:800; color:#6b21a8; margin-bottom:10px;">🎮 K-Pop Idol Mini Game (အစမ်းဆော့ရန်)</h3>
        <div style="display:flex; gap:10px; justify-content:center; margin-bottom:12px;">
          <button id="btn-game-bts" class="game-btn" style="background:#7c3aed;">💜 BTS Game</button>
          <button id="btn-game-bp" class="game-btn" style="background:#ec4899;">🩷 BLACKPINK Game</button>
        </div>

        <div id="game-play-area" class="hidden">
          <p id="game-hint-text" style="font-weight:bold; font-size:0.95rem; margin-bottom:10px; color:#4c1d95;"></p>
          <input type="text" id="game-ans-input" class="input-modern" placeholder="Member နာမည် ရိုက်ထည့်ပါ..." style="text-align:center; max-width:250px; margin:0 auto 10px;">
          <button id="btn-submit-game" class="btn-primary" style="padding:8px 16px; font-size:0.85rem;">အဖြေစစ်မည်</button>
        </div>
      </section>

      <!-- PRODUCT CATALOGUE / STOCK DISPLAY -->
      <section class="view-card">
        <h2 style="font-size:1rem; font-weight:800; margin-bottom:12px;">🏷️ ရရှိနိုင်သော ပစ္စည်းများ</h2>
        <div id="shop-products-list">Loading products...</div>
      </section>

      <!-- CHECKOUT / ORDER FORM -->
      <section class="view-card" style="margin-top:20px;">
        <h2 style="font-size:1rem; font-weight:800; margin-bottom:12px;">📦 အော်ဒါ တင်သွင်းရန်</h2>
        <input type="text" id="cust-name" class="input-modern" placeholder="သင့်အမည်">
        <input type="text" id="cust-phone" class="input-modern" placeholder="ဖုန်းနံပါတ်">
        <input type="text" id="cust-item" class="input-modern" placeholder="ဝယ်ယူမည့် ပစ္စည်းအမည်">
        <input type="number" id="cust-qty" class="input-modern" placeholder="အရေအတွက် (Qty)" value="1">
        <textarea id="cust-note" class="input-modern" placeholder="မှတ်ချက် (မရှိပါက လွတ်ထားနိုင်သည်)"></textarea>
        
        <button id="btn-submit-order" class="btn-primary">Order အတည်ပြုမည် ➔</button>

        <!-- RECEIPT DISPLAY WITH LOGO -->
        <div id="order-receipt-area" class="receipt-box hidden">
          <div style="font-weight:900; color:#a21caf; font-size:1.1rem; margin-bottom:5px;">🛍️ PHOO SHOP RECEIPT</div>
          <p style="font-size:0.85rem;">Order Code: <b id="rec-code" style="color:#d946ef;"></b></p>
          <p style="font-size:0.85rem;">မှာယူသည့် ပစ္စည်း: <span id="rec-item"></span></p>
          <p style="font-size:0.8rem; color:#6b21a8; margin-top:6px;">Order ကို အောင်မြင်စွာ လက်ခံရရှိပါပြီ။</p>
        </div>
      </section>

      <!-- REPORT SYSTEM & STATUS CHECKER -->
      <section class="report-card">
        <h3 style="font-size:1rem; font-weight:800; color:#e11d48; margin-bottom:10px;">🚨 Report တင်ရန် / အခြေအနေစစ်ရန်</h3>
        <div style="display:flex; gap:8px; margin-bottom:12px;">
          <button id="tab-rep-sub" class="btn-primary" style="flex:1; padding:8px; font-size:0.8rem;">Report တင်မည်</button>
          <button id="tab-rep-chk" class="btn-secondary" style="flex:1; padding:8px; font-size:0.8rem; background:#059669; color:white;">Report စစ်မည်</button>
        </div>

        <!-- SUBMIT FORM -->
        <div id="sec-rep-sub-form">
          <textarea id="rep-text-input" class="input-modern" placeholder="ကြုံတွေ့ရသော အခက်အခဲ/တိုင်ကြားစာ ရေးသားပါ..." style="height:70px;"></textarea>
          <button id="btn-send-report" class="btn-primary" style="background:#e11d48;">Report ပေးပို့မည်</button>
        </div>

        <!-- CHECKER FORM -->
        <div id="sec-rep-chk-form" class="hidden">
          <input type="text" id="rep-code-search" class="input-modern" placeholder="Report Code (ဥပမာ - RP-1234)">
          <button id="btn-check-report" class="btn-primary" style="background:#059669;">Status စစ်မည်</button>
          <div id="rep-status-output" style="margin-top:10px; font-size:0.9rem; font-weight:bold; text-align:center;"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkT8J7ttr9w-ZJJmbyu6aT9qLCUmauXcA",
      authDomain: "my-k-pop-shop.firebaseapp.com",
      projectId: "my-k-pop-shop",
      storageBucket: "my-k-pop-shop.firebasestorage.app",
      messagingSenderId: "697172084426",
      appId: "1:697172084426:web:6fb0b4cf2cc1f57e291633"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. DEVICE LIKE LOGIC
    const likeBtn = document.getElementById("btn-heart");
    const likeCountEl = document.getElementById("like-count");

    async function initLikes() {
      const docRef = doc(db, "settings", "shop_likes");
      const snap = await getDoc(docRef);
      if(snap.exists()) {
        likeCountEl.innerText = snap.data().count + " Likes";
      } else {
        await setDoc(docRef, { count: 0 });
      }

      if(localStorage.getItem("phoo_shop_liked")) {
        likeBtn.classList.add("liked");
        likeBtn.innerText = "❤️ အသည်းပေးပြီးပါပြီ";
      }
    }
    initLikes();

    likeBtn.onclick = async () => {
      if(localStorage.getItem("phoo_shop_liked")) {
        return alert("သင့် Device ဖြင့် အသည်းပေးပြီးဖြစ်ပါသည်။");
      }
      const docRef = doc(db, "settings", "shop_likes");
      await updateDoc(docRef, { count: increment(1) });
      localStorage.setItem("phoo_shop_liked", "true");
      likeBtn.classList.add("liked");
      likeBtn.innerText = "❤️ အသည်းပေးပြီးပါပြီ";
      const snap = await getDoc(docRef);
      likeCountEl.innerText = snap.data().count + " Likes";
    };

    // 2. BTS & BLACKPINK GAME LOGIC
    const gameData = {
      BTS: [{ hint: "👑 BTS ရဲ့ Leader က ဘယ်သူလဲ?", ans: "rm" }, { hint: "💜 'Worldwide Handsome' လို့ တင်စားခံရသူ?", ans: "jin" }],
      BLACKPINK: [{ hint: "🩷 BLACKPINK ရဲ့ Main Dancer က ဘယ်သူလဲ?", ans: "lisa" }, { hint: "🌹 'On The Ground' သီချင်းဆိုထားသူ?", ans: "rose" }]
    };
    let currentGame = null, currentQ = null;

    document.getElementById("btn-game-bts").onclick = () => startGame('BTS');
    document.getElementById("btn-game-bp").onclick = () => startGame('BLACKPINK');

    function startGame(group) {
      currentGame = group;
      currentQ = gameData[group][Math.floor(Math.random() * gameData[group].length)];
      document.getElementById("game-hint-text").innerText = currentQ.hint;
      document.getElementById("game-play-area").classList.remove("hidden");
    }

    document.getElementById("btn-submit-game").onclick = () => {
      const userAns = document.getElementById("game-ans-input").value.trim().toLowerCase();
      if(userAns === currentQ.ans) {
        alert("🎉 မှန်ကန်ပါတယ်ဗျာ! မှန်အောင် ဖြေဆိုနိုင်ခဲ့ပါတယ်။");
        document.getElementById("game-ans-input").value = "";
        document.getElementById("game-play-area").classList.add("hidden");
      } else {
        alert("❌ မှားနေပါတယ်၊ ပြန်လည် ကြိုးစားကြည့်ပါ!");
      }
    };

    // 3. LOAD PRODUCTS DISPLAY
    async function loadShopProducts() {
      const container = document.getElementById("shop-products-list");
      const snapshot = await getDocs(collection(db, "products"));
      container.innerHTML = "";

      if(snapshot.empty) {
        container.innerHTML = "<p style='text-align:center;'>ပစ္စည်းများ မရှိသေးပါ။</p>";
        return;
      }

      snapshot.forEach(docSnap => {
        const p = docSnap.data();
        const card = document.createElement("div");
        card.style.cssText = "background:#fff; padding:10px; border-radius:12px; margin-bottom:10px; display:flex; align-items:center; gap:10px; border:1px solid #e9d5ff;";
        card.innerHTML = `
          <img src="${p.showPhoto}" style="width:50px; height:50px; border-radius:8px; object-fit:cover;">
          <div>
            <b style="font-size:0.9rem;">${p.name}</b>
            <p style="font-size:0.85rem; color:#8b5cf6; font-weight:bold;">${p.price} Ks</p>
          </div>
        `;
        container.appendChild(card);
      });
    }
    loadShopProducts();

    // 4. SUBMIT ORDER LOGIC
    document.getElementById("btn-submit-order").onclick = async () => {
      const name = document.getElementById("cust-name").value;
      const phone = document.getElementById("cust-phone").value;
      const item = document.getElementById("cust-item").value;
      const qty = document.getElementById("cust-qty").value;
      const note = document.getElementById("cust-note").value;

      if(!name || !item) return alert("အမည်နှင့် ပစ္စည်းအမည် ဖြည့်စွက်ပေးပါ။");

      const code = "ORD-" + Math.floor(1000 + Math.random() * 9000);
      await addDoc(collection(db, "orders"), {
        orderCode: code, customerName: name, phone: phone,
        item: item, qty: qty, note: note, status: "order စစ်ဆေးနေဆဲ"
      });

      document.getElementById("rec-code").innerText = code;
      document.getElementById("rec-item").innerText = `${item} (${qty}ခု)`;
      document.getElementById("order-receipt-area").classList.remove("hidden");
      alert("Order တင်ခြင်း အောင်မြင်ပါသည်။");
    };

    // 5. REPORT SYSTEM LOGIC
    const btnRepSub = document.getElementById("tab-rep-sub");
    const btnRepChk = document.getElementById("tab-rep-chk");
    const secRepSub = document.getElementById("sec-rep-sub-form");
    const secRepChk = document.getElementById("sec-rep-chk-form");

    btnRepSub.onclick = () => {
      secRepSub.classList.remove("hidden"); secRepChk.classList.add("hidden");
    };
    btnRepChk.onclick = () => {
      secRepChk.classList.remove("hidden"); secRepSub.classList.add("hidden");
    };

    document.getElementById("btn-send-report").onclick = async () => {
      const msg = document.getElementById("rep-text-input").value.trim();
      if(!msg) return alert("Report အကြောင်းအရာ ရိုက်ထည့်ပါ။");

      const rpCode = "RP-" + Math.floor(1000 + Math.random() * 9000);
      await addDoc(collection(db, "reports"), {
        reportCode: rpCode, message: msg, status: "စစ်ဆေးနေဆဲ"
      });

      alert(`Report ပေးပို့ပြီးပါပြီ!\nသင့် Report Code မှာ [ ${rpCode} ] ဖြစ်ပါသည်။`);
      document.getElementById("rep-text-input").value = "";
    };

    document.getElementById("btn-check-report").onclick = async () => {
      const code = document.getElementById("rep-code-search").value.trim();
      const outEl = document.getElementById("rep-status-output");
      if(!code) return alert("Report Code ရိုက်ထည့်ပါ။");

      outEl.innerText = "⏳ စစ်ဆေးနေပါသည်...";
      const snapshot = await getDocs(collection(db, "reports"));
      let found = false;

      snapshot.forEach(docSnap => {
        const r = docSnap.data();
        if(r.reportCode === code) {
          found = true;
          outEl.innerHTML = `အခြေအနေ: <span style="color:#d946ef;">${r.status}</span>`;
        }
      });

      if(!found) outEl.innerText = "❌ Report Code ရှာမတွေ့ပါ။";
    };
  </script>
</body>
</html>
