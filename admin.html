<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phoo Shop Admin Panel</title>
  <style>
    :root {
      --primary: #d946ef;
      --primary-dark: #a21caf;
      --accent: #8b5cf6;
      --card-bg: #ffffff;
      --text-main: #2e1065;
      --text-sub: #6b21a8;
      --body-bg: linear-gradient(135deg, #fae8ff 0%, #f3e8ff 50%, #e9d5ff 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

    body {
      background: var(--body-bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 15px 60px;
    }

    .admin-card {
      max-width: 500px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 20px;
      border: 3px solid #f0abfc;
      box-shadow: 0 10px 25px rgba(217, 70, 239, 0.2);
    }

    h2 { color: var(--primary-dark); text-align: center; margin-bottom: 20px; font-weight: 900; }
    
    label { font-weight: 800; font-size: 0.85rem; color: var(--text-sub); display: block; margin-top: 12px; }

    .input-field {
      width: 100%; padding: 10px 12px; border-radius: 12px; border: 2px solid #e9d5ff;
      margin-top: 5px; outline: none; background: #faf5ff; font-size: 0.9rem; color: var(--text-main);
    }
    .input-field:focus { border-color: var(--primary); background: #fff; }

    .btn-submit {
      width: 100%; background: linear-gradient(135deg, var(--primary), var(--accent)); color: white;
      border: none; padding: 12px; border-radius: 14px; font-weight: 800;
      margin-top: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(217, 70, 239, 0.4); font-size: 0.95rem;
    }
    .btn-submit:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }

    .btn-drive-tool {
      width: 100%; background: linear-gradient(135deg, #059669, #10b981); color: white;
      border: none; padding: 10px; border-radius: 12px; font-weight: 800;
      margin-top: 15px; cursor: pointer; font-size: 0.85rem; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .status-msg { text-align: center; margin-top: 15px; font-weight: bold; font-size: 0.9rem; }

    /* GOOGLE DRIVE CHANGER MODAL STYLING */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(46, 16, 101, 0.7); backdrop-filter: blur(5px);
      display: none; justify-content: center; align-items: center; z-index: 500;
      padding: 15px;
    }
    .modal-overlay.active { display: flex; }

    .drive-modal-box {
      background: #fff; max-width: 480px; width: 100%; border-radius: 20px;
      padding: 20px; border: 3px solid #10b981; box-shadow: 0 15px 30px rgba(0,0,0,0.25);
      position: relative; max-height: 90vh; overflow-y: auto;
    }

    .btn-copy {
      background: #8b5cf6; color: white; border: none; padding: 8px 12px;
      border-radius: 8px; font-size: 0.8rem; font-weight: 800; cursor: pointer;
      margin-top: 6px; width: 100%; display: block;
    }
    .btn-copy-comma { background: #059669; }

    .close-btn {
      position: absolute; right: 15px; top: 15px; background: none; border: none;
      font-size: 1.2rem; cursor: pointer; color: #666;
    }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2>🛠️ Phoo Shop Admin Panel</h2>
    
    <button class="btn-drive-tool" onclick="openDriveChanger()">🔄 Google Drive Changer သို့သွားရန်</button>
    <hr style="margin-top:15px; border:0; border-top:1px dashed #f0abfc;">

    <label>Admin Password ရိုက်ထည့်ပါ:</label>
    <input type="password" id="admin-pass" class="input-field" placeholder="🔑 Admin Password">

    <label>ပစ္စည်းအမည်:</label>
    <input type="text" id="p-name" class="input-field" placeholder="ဥပမာ - Album / Lightstick">

    <label>စျေးနှုန်း (ကျပ်):</label>
    <input type="number" id="p-price" class="input-field" placeholder="ဥပမာ - 15000">

    <label>🖼️ ပင်မပုံ (Show Photo) တိုက်ရိုက်တင်ရန်:</label>
    <input type="file" id="p-show-file" class="input-field" accept="image/*">

    <label>📸 အသေးစိတ်ပုံများ (Detail Photos) တိုက်ရိုက်တင်ရန်:</label>
    <input type="file" id="p-detail-files" class="input-field" accept="image/*" multiple>

    <button id="btn-save" class="btn-submit" onclick="uploadAndSaveProduct()">✨ ပစ္စည်းသိမ်းဆည်းမည်</button>
    
    <div id="status" class="status-msg"></div>
  </div>

  <!-- GOOGLE DRIVE CHANGER MODAL -->
  <div id="drive-modal" class="modal-overlay">
    <div class="drive-modal-box">
      <button class="close-btn" onclick="closeDriveChanger()">❌</button>
      <h3 style="color:#059669; text-align:center; font-weight:900; margin-bottom:15px;">🔄 Google Drive Changer</h3>

      <label>1. Show Photo Drive Link ထည့်ရန်:</label>
      <input type="text" id="drive-show-input" class="input-field" placeholder="Google Drive Link ကူးထည့်ပါ...">

      <label>2. Detail Photo 1 Drive Link:</label>
      <input type="text" id="drive-detail-1" class="input-field" placeholder="Google Drive Link ကူးထည့်ပါ...">

      <label>3. Detail Photo 2 Drive Link:</label>
      <input type="text" id="drive-detail-2" class="input-field" placeholder="Google Drive Link ကူးထည့်ပါ...">

      <label>4. Detail Photo 3 Drive Link:</label>
      <input type="text" id="drive-detail-3" class="input-field" placeholder="Google Drive Link ကူးထည့်ပါ...">

      <button class="btn-submit" style="background:linear-gradient(135deg, #059669, #10b981);" onclick="generateDriveLinks()">⚙️ Generate Links</button>

      <div id="drive-output-section" style="display:none; margin-top:15px; background:#f0fdf4; padding:12px; border-radius:12px; border:1px solid #a7f3d0;">
        <label style="color:#065f46;">Direct Show Photo Link:</label>
        <input type="text" id="out-show-link" class="input-field" readonly>
        <button class="btn-copy" onclick="copyToClipboard('out-show-link')">📋 Show Photo Link Copy ရယူရန်</button>

        <label style="color:#065f46; margin-top:10px;">Direct Detail Photos (Comma ခံထားသည်):</label>
        <textarea id="out-detail-links" class="input-field" style="height:60px; resize:none;" readonly></textarea>
        <button class="btn-copy btn-copy-comma" onclick="copyToClipboard('out-detail-links')">📋 Detail Links (Comma ခံလျက်) Copy ရယူရန်</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkT8J7ttr9w-ZJJmbyu6aT9qLCUmauXcA",
      authDomain: "my-k-pop-shop.firebaseapp.com",
      projectId: "my-k-pop-shop",
      storageBucket: "my-k-pop-shop.firebasestorage.app",
      messagingSenderId: "697172084426",
      appId: "1:697172084426:web:6fb0b4cf2cc1f57e291633"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const IMGBB_API_KEY = "3b4f610a7b489ffca3387ebdbd6d332d";

    const ADMIN_PASSWORD_HASH = "phoo1234";

    async function uploadToImgBB(file) {
      const formData = new FormData();
      formData.append("image", file);
      const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: "POST",
        body: formData
      });
      const data = await res.json();
      return data.data.url;
    }

    window.uploadAndSaveProduct = async function() {
      const pass = document.getElementById("admin-pass").value.trim();
      const name = document.getElementById("p-name").value.trim();
      const price = document.getElementById("p-price").value.trim();
      const showFileInput = document.getElementById("p-show-file");
      const detailFilesInput = document.getElementById("p-detail-files");
      const status = document.getElementById("status");
      const btn = document.getElementById("btn-save");

      // PASSWORD SECURITY FIX: Password မှားပါက Password ကြီး ပြန်မပြတော့ပါ
      if (pass !== ADMIN_PASSWORD_HASH) {
        return alert("❌ Admin စကားဝှက် မှားယွင်းနေပါသည်။");
      }

      if (!name || !price || !showFileInput.files[0]) {
        return alert("ကျေးဇူးပြု၍ အမည်၊ စျေးနှုန်း နှင့် ပင်မပုံ ရွေးချယ်ပေးပါ!");
      }

      try {
        btn.disabled = true;
        status.style.color = "#8b5cf6";
        status.innerText = "⏳ ပုံများကို Upload တင်နေပါသည်...";

        const showPhotoUrl = await uploadToImgBB(showFileInput.files[0]);

        const detailUrls = [];
        const detailFiles = detailFilesInput.files;
        for (let i = 0; i < detailFiles.length; i++) {
          const url = await uploadToImgBB(detailFiles[i]);
          detailUrls.push(url);
        }

        status.innerText = "⏳ Database သို့ အချက်အလက် သိမ်းဆည်းနေပါသည်...";

        await addDoc(collection(db, "products"), {
          name: name,
          price: parseInt(price),
          showPhoto: showPhotoUrl,
          detailPhotos: detailUrls,
          createdAt: new Date()
        });

        status.style.color = "green";
        status.innerText = "✅ ပစ္စည်းသစ် အောင်မြင်စွာ ထည့်သွင်းပြီးပါပြီ!";

        document.getElementById("p-name").value = "";
        document.getElementById("p-price").value = "";
        document.getElementById("admin-pass").value = "";
        showFileInput.value = "";
        detailFilesInput.value = "";

      } catch (err) {
        console.error(err);
        status.style.color = "red";
        status.innerText = "❌ Upload တင်ရာတွင် အမှားအယွင်း ရှိနေပါသည်။";
      } finally {
        btn.disabled = false;
      }
    };

    // GOOGLE DRIVE CHANGER FUNCTIONS
    window.openDriveChanger = function() {
      document.getElementById("drive-modal").classList.add("active");
    };

    window.closeDriveChanger = function() {
      document.getElementById("drive-modal").classList.remove("active");
    };

    function convertDriveLink(url) {
      if (!url) return "";
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}`;
      }
      return url.trim();
    }

    window.generateDriveLinks = function() {
      const showRaw = document.getElementById("drive-show-input").value;
      const d1Raw = document.getElementById("drive-detail-1").value;
      const d2Raw = document.getElementById("drive-detail-2").value;
      const d3Raw = document.getElementById("drive-detail-3").value;

      const showDirect = convertDriveLink(showRaw);
      
      const detailDirects = [];
      if (d1Raw) detailDirects.push(convertDriveLink(d1Raw));
      if (d2Raw) detailDirects.push(convertDriveLink(d2Raw));
      if (d3Raw) detailDirects.push(convertDriveLink(d3Raw));

      document.getElementById("out-show-link").value = showDirect;
      document.getElementById("out-detail-links").value = detailDirects.join(",");

      document.getElementById("drive-output-section").style.display = "block";
    };

    window.copyToClipboard = function(elementId) {
      const inputEl = document.getElementById(elementId);
      inputEl.select();
      inputEl.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(inputEl.value);
      alert("📋 Copy ကူးယူပြီးပါပြီ!");
    };
  </script>
</body>
</html>
