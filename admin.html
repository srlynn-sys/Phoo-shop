<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phoo Shop Admin Panel</title>
  <style>
    :root {
      --primary: #d946ef;
      --primary-dark: #a21caf;
      --accent: #8b5cf6;
      --bg-color: #f3e8ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg-color); color: #2e1065; padding: 20px 10px; }

    /* AUTH OVERLAY */
    #auth-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #2e1065; display: flex; justify-content: center; align-items: center;
      z-index: 9999; padding: 20px;
    }
    .login-box {
      background: white; padding: 30px; border-radius: 20px; max-width: 380px; width: 100%;
      text-align: center; border: 3px solid #f0abfc; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .main-container { max-width: 600px; margin: 0 auto; display: none; }

    /* TAB BUTTONS */
    .tab-menu { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn {
      flex: 1; padding: 12px 5px; border: none; background: #e9d5ff; color: #5b21b6;
      font-weight: 800; border-radius: 12px; cursor: pointer; font-size: 0.85rem;
      transition: 0.3s;
    }
    .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(217, 70, 239, 0.4); }

    .tab-content { display: none; background: white; padding: 20px; border-radius: 20px; border: 2px solid #f0abfc; }
    .tab-content.active { display: block; }

    label { font-weight: 800; font-size: 0.85rem; color: #6b21a8; display: block; margin-top: 12px; }
    .input-field {
      width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #e9d5ff;
      margin-top: 5px; outline: none; background: #faf5ff; font-size: 0.9rem;
    }
    .btn-submit {
      width: 100%; background: linear-gradient(135deg, var(--primary), var(--accent)); color: white;
      border: none; padding: 12px; border-radius: 12px; font-weight: 800; margin-top: 18px; cursor: pointer;
    }
    .btn-copy {
      background: #8b5cf6; color: white; border: none; padding: 8px 12px;
      border-radius: 8px; font-size: 0.8rem; font-weight: 800; cursor: pointer; margin-top: 6px; width: 100%;
    }
  </style>
</head>
<body>

  <!-- PAGE ဝင်ဝင်ချင်း PASSWORD တောင်းသည့် POPUP -->
  <div id="auth-overlay">
    <div class="login-box">
      <h2 style="color: #a21caf; margin-bottom: 15px;">🔒 Admin Verification</h2>
      <p style="font-size: 0.85rem; margin-bottom: 15px; color: #666;">Admin Panel သို့ ဝင်ရောက်ရန် Password ရိုက်ထည့်ပါ</p>
      <input type="password" id="login-pass" class="input-field" placeholder="Password ရိုက်ပါ..." style="text-align: center;">
      <button class="btn-submit" onclick="checkPassword()">ဝင်ရောက်မည်</button>
    </div>
  </div>

  <!-- MAIN ADMIN PANEL (PASSWORD မှန်မှ ပေါ်မည်) -->
  <div id="main-panel" class="main-container">

    <!-- NAVIGATION TABS -->
    <div class="tab-menu">
      <button class="tab-btn active" onclick="switchTab('tab-orders', this)">1️⃣ Orders Edit</button>
      <button class="tab-btn" onclick="switchTab('tab-stock', this)">2️⃣ Stock Post တင်ရန်</button>
      <button class="tab-btn" onclick="switchTab('tab-drive', this)">3️⃣ Drive Link Changer</button>
    </div>

    <!-- OPTION 1: ORDERS EDIT -->
    <div id="tab-orders" class="tab-content active">
      <h3 style="color: var(--primary-dark);">📦 Orders များကို စီစစ်/Edit လုပ်ရန်</h3>
      <p style="font-size: 0.85rem; color: #666; margin-top: 5px;">အော်ဒါများ စီစစ်ရန်နှင့် ပြင်ဆင်ရန် အပိုင်းဖြစ်ပါသည်။</p>
      <div id="orders-list" style="margin-top: 15px;">
        <p style="color: #888;">Order များ တင်ထားခြင်း မရှိသေးပါ။</p>
      </div>
    </div>

    <!-- OPTION 2: STOCK POST (LINK များသာ ထည့်သည့် အဟောင်းအတိုင်း) -->
    <div id="tab-stock" class="tab-content">
      <h3 style="color: var(--primary-dark);">➕ Stock Post အသစ်တင်ရန်</h3>

      <label>ပစ္စည်းအမည်:</label>
      <input type="text" id="p-name" class="input-field" placeholder="ဥပမာ - Album / Lightstick">

      <label>စျေးနှုန်း (ကျပ်):</label>
      <input type="number" id="p-price" class="input-field" placeholder="ဥပမာ - 15000">

      <label>🖼️ Show Photo Link (Direct Link):</label>
      <input type="text" id="p-show-link" class="input-field" placeholder="https://...">

      <label>📸 Detail Photo Links (Comma ခံ၍ ထည့်ရန်):</label>
      <textarea id="p-detail-links" class="input-field" style="height: 70px; resize: none;" placeholder="link1, link2, link3"></textarea>

      <button id="btn-save-stock" class="btn-submit" onclick="saveStockPost()">✨ Post တင်မည်</button>
      <div id="stock-status" style="text-align:center; margin-top:10px; font-weight:bold;"></div>
    </div>

    <!-- OPTION 3: GOOGLE DRIVE LINK CHANGER -->
    <div id="tab-drive" class="tab-content">
      <h3 style="color: #059669;">🔄 Google Drive Link Changer</h3>

      <label>1. Show Photo Drive Link:</label>
      <input type="text" id="drive-show-input" class="input-field" placeholder="Drive Link ကူးထည့်ပါ...">

      <label>2. Detail Photo 1 Drive Link:</label>
      <input type="text" id="drive-detail-1" class="input-field" placeholder="Drive Link 1...">

      <label>3. Detail Photo 2 Drive Link:</label>
      <input type="text" id="drive-detail-2" class="input-field" placeholder="Drive Link 2...">

      <label>4. Detail Photo 3 Drive Link:</label>
      <input type="text" id="drive-detail-3" class="input-field" placeholder="Drive Link 3...">

      <button class="btn-submit" style="background: linear-gradient(135deg, #059669, #10b981);" onclick="generateDriveLinks()">⚙️ Generate Direct Links</button>

      <div id="drive-output-section" style="display:none; margin-top:15px; background:#f0fdf4; padding:12px; border-radius:12px; border:1px solid #a7f3d0;">
        <label style="color:#065f46;">Show Photo Link:</label>
        <input type="text" id="out-show-link" class="input-field" readonly>
        <button class="btn-copy" onclick="copyToClipboard('out-show-link')">📋 Copy Show Photo Link</button>

        <label style="color:#065f46; margin-top:10px;">Detail Photo Links (Comma ခံထားသည်):</label>
        <textarea id="out-detail-links" class="input-field" style="height:60px; resize:none;" readonly></textarea>
        <button class="btn-copy" style="background:#059669;" onclick="copyToClipboard('out-detail-links')">📋 Copy Detail Links (Comma)</button>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkT8J7ttr9w-ZJJmbyu6aT9qLCUmauXcA",
      authDomain: "my-k-pop-shop.firebaseapp.com",
      projectId: "my-k-pop-shop",
      storageBucket: "my-k-pop-shop.firebasestorage.app",
      messagingSenderId: "697172084426",
      appId: "1:697172084426:web:6fb0b4cf2cc1f57e291633"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // PASSWORD CHECK (254007)
    window.checkPassword = function() {
      const inputPass = document.getElementById("login-pass").value.trim();
      if (inputPass === "254007") {
        document.getElementById("auth-overlay").style.display = "none";
        document.getElementById("main-panel").style.display = "block";
      } else {
        alert("❌ စကားဝှက် မှားယွင်းနေပါသည်။");
      }
    };

    // TAB SWITCHING
    window.switchTab = function(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    };

    // OPTION 2: SAVE STOCK POST (LINKS ONLY)
    window.saveStockPost = async function() {
      const name = document.getElementById("p-name").value.trim();
      const price = document.getElementById("p-price").value.trim();
      const showLink = document.getElementById("p-show-link").value.trim();
      const detailLinksRaw = document.getElementById("p-detail-links").value.trim();
      const status = document.getElementById("stock-status");

      if (!name || !price || !showLink) {
        return alert("ကျေးဇူးပြု၍ အမည်၊ စျေးနှုန်း နှင့် Show Photo Link ထည့်ပေးပါ။");
      }

      const detailPhotoArray = detailLinksRaw ? detailLinksRaw.split(",").map(item => item.trim()) : [];

      try {
        status.style.color = "#8b5cf6";
        status.innerText = "⏳ သိမ်းဆည်းနေပါသည်...";

        await addDoc(collection(db, "products"), {
          name: name,
          price: parseInt(price),
          showPhoto: showLink,
          detailPhotos: detailPhotoArray,
          createdAt: new Date()
        });

        status.style.color = "green";
        status.innerText = "✅ Stock Post အောင်မြင်စွာ တင်ပြီးပါပြီ!";

        document.getElementById("p-name").value = "";
        document.getElementById("p-price").value = "";
        document.getElementById("p-show-link").value = "";
        document.getElementById("p-detail-links").value = "";

      } catch (err) {
        console.error(err);
        status.style.color = "red";
        status.innerText = "❌ အမှားအယွင်း ရှိနေပါသည်။";
      }
    };

    // OPTION 3: GOOGLE DRIVE LINK CHANGER LOGIC
    function convertDriveLink(url) {
      if (!url) return "";
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}`;
      }
      return url.trim();
    }

    window.generateDriveLinks = function() {
      const showRaw = document.getElementById("drive-show-input").value;
      const d1Raw = document.getElementById("drive-detail-1").value;
      const d2Raw = document.getElementById("drive-detail-2").value;
      const d3Raw = document.getElementById("drive-detail-3").value;

      const showDirect = convertDriveLink(showRaw);
      
      const detailDirects = [];
      if (d1Raw) detailDirects.push(convertDriveLink(d1Raw));
      if (d2Raw) detailDirects.push(convertDriveLink(d2Raw));
      if (d3Raw) detailDirects.push(convertDriveLink(d3Raw));

      document.getElementById("out-show-link").value = showDirect;
      document.getElementById("out-detail-links").value = detailDirects.join(",");

      document.getElementById("drive-output-section").style.display = "block";
    };

    window.copyToClipboard = function(elementId) {
      const inputEl = document.getElementById(elementId);
      inputEl.select();
      inputEl.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(inputEl.value);
      alert("📋 Copy ကူးယူပြီးပါပြီ!");
    };
  </script>
</body>
</html>
