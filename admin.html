<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Phoo Shop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* DRIVE LINK CHANGER STYLES */
    .btn-copy {
      background: #8b5cf6; color: white; border: none; padding: 10px;
      border-radius: 10px; font-size: 0.85rem; font-weight: 800; cursor: pointer;
      margin-top: 6px; width: 100%; display: block; text-align: center;
    }
    .btn-copy-comma { background: #059669; }
    .drive-out-box {
      margin-top: 15px; background: #f0fdf4; padding: 14px;
      border-radius: 14px; border: 1px solid #a7f3d0;
    }
    /* REPORT CARD STYLES */
    .report-card {
      background: #fff1f2; padding: 14px; border-radius: 16px;
      border: 1px solid #fecdd3; margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="site-header">
      <h1 class="shop-title">⚙️ Admin Control Panel</h1>
      <p class="address">Phoo K-pop & Thai-pop Shop</p>
    </header>

    <!-- Passcode Login Section -->
    <section id="admin-login-sec" class="view-card">
      <h2 style="font-size:1.1rem; font-weight:800; margin-bottom:10px; text-align:center;">🔐 Admin Passcode ထည့်ပါ</h2>
      <input type="password" id="admin-passcode-input" class="input-modern" placeholder="Passcode ရိုက်ထည့်ပါ..." style="text-align:center; font-size:1.2rem;">
      <button id="btn-admin-login" class="btn-primary">Dashboard သို့ဝင်မည် ➔</button>
    </section>

    <!-- Main Dashboard -->
    <main id="admin-dashboard-sec" class="hidden">
      <!-- TAB BAR (4 TABS) -->
      <div class="admin-tab-bar" style="display:flex; gap:5px; margin-bottom:15px;">
        <button id="tab-btn-orders" class="admin-tab-btn active" style="flex:1; font-size:0.8rem;">📦 Orders</button>
        <button id="tab-btn-stock" class="admin-tab-btn" style="flex:1; font-size:0.8rem;">🏷️ Stock</button>
        <button id="tab-btn-drive" class="admin-tab-btn" style="flex:1; font-size:0.8rem;">🔄 Drive</button>
        <button id="tab-btn-report" class="admin-tab-btn" style="flex:1; font-size:0.8rem; background:#ffe4e6; color:#e11d48;">🚨 Reports</button>
      </div>

      <!-- Tab 1: Order Editing -->
      <section id="tab-sec-orders" class="view-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <h2 style="font-size:1rem; font-weight:800;">📦 Orders စာရင်း & Status ပြင်ရန်</h2>
          <button id="btn-reset-all-orders" class="btn-danger">⚠️ Reset All Orders</button>
        </div>
        <div id="admin-orders-list">Loading...</div>
      </section>

      <!-- Tab 2: Stock Editing -->
      <section id="tab-sec-stock" class="view-card hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <h2 style="font-size:1rem; font-weight:800;">➕ ပစ္စည်းအသစ် တင်ရန် / Edit လုပ်ရန်</h2>
          <button id="btn-reset-all-stock" class="btn-danger">⚠️ Reset All Stock</button>
        </div>

        <input type="hidden" id="p-edit-id">
        <input type="text" id="p-name" class="input-modern" placeholder="ပစ္စည်းအမည်">
        <input type="number" id="p-price" class="input-modern" placeholder="ဈေးနှုန်း (Ks)">
        <input type="text" id="p-show-img" class="input-modern" placeholder="Show Photo Direct URL">
        <input type="text" id="p-detail-imgs" class="input-modern" placeholder="Detail Photo Links (ကော်မာ ၊ ခြားရေးပါ)">
        
        <button id="btn-save-product" class="btn-primary">ပစ္စည်း တင်မည် / သိမ်းဆည်းမည် ➔</button>
        <button id="btn-cancel-edit" class="btn-secondary hidden">Cancel Edit</button>

        <h3 style="font-size:1rem; font-weight:800; margin:20px 0 10px 0;">🏷️ လက်ရှိ တင်ထားသော ပစ္စည်းများ</h3>
        <div id="admin-products-list">Loading...</div>
      </section>

      <!-- Tab 3: Google Drive Link Changer -->
      <section id="tab-sec-drive" class="view-card hidden">
        <h2 style="font-size:1rem; font-weight:800; color:#059669; margin-bottom:15px;">🔄 Google Drive Link Changer</h2>
        
        <label style="font-size:0.85rem; font-weight:700;">Show Photo Drive Link:</label>
        <input type="text" id="drive-show-input" class="input-modern" placeholder="Google Drive Link ကူးထည့်ပါ...">

        <label style="font-size:0.85rem; font-weight:700; margin-top:8px; display:block;">Detail Photo 1 Link:</label>
        <input type="text" id="drive-detail-1" class="input-modern" placeholder="Detail Photo 1 Drive Link...">

        <label style="font-size:0.85rem; font-weight:700; margin-top:8px; display:block;">Detail Photo 2 Link:</label>
        <input type="text" id="drive-detail-2" class="input-modern" placeholder="Detail Photo 2 Drive Link...">

        <label style="font-size:0.85rem; font-weight:700; margin-top:8px; display:block;">Detail Photo 3 Link:</label>
        <input type="text" id="drive-detail-3" class="input-modern" placeholder="Detail Photo 3 Drive Link...">

        <button id="btn-generate-drive" class="btn-primary" style="background:linear-gradient(135deg, #059669, #10b981); margin-top:12px;">⚙️ Direct Links ပြောင်းမည် ➔</button>

        <div id="drive-output-sec" class="drive-out-box hidden">
          <label style="font-size:0.85rem; font-weight:800; color:#065f46;">Direct Show Photo Link:</label>
          <input type="text" id="out-show-link" class="input-modern" readonly>
          <button id="btn-copy-show" class="btn-copy">📋 Show Photo Link Copy ရယူရန်</button>

          <label style="font-size:0.85rem; font-weight:800; color:#065f46; margin-top:12px; display:block;">Direct Detail Photo Links (Comma ခံထားသည်):</label>
          <textarea id="out-detail-links" class="input-modern" style="height:65px; resize:none;" readonly></textarea>
          <button id="btn-copy-detail" class="btn-copy btn-copy-comma">📋 Detail Links (Comma ခံလျက်) Copy ရယူရန်</button>
        </div>
      </section>

      <!-- Tab 4: Report Management (NEW) -->
      <section id="tab-sec-report" class="view-card hidden">
        <h2 style="font-size:1rem; font-weight:800; color:#e11d48; margin-bottom:15px;">🚨 Customer Reports စာရင်း</h2>
        <div id="admin-reports-list">Loading...</div>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkT8J7ttr9w-ZJJmbyu6aT9qLCUmauXcA",
      authDomain: "my-k-pop-shop.firebaseapp.com",
      projectId: "my-k-pop-shop",
      storageBucket: "my-k-pop-shop.firebasestorage.app",
      messagingSenderId: "697172084426",
      appId: "1:697172084426:web:6fb0b4cf2cc1f57e291633"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ADMIN LOGIN LOGIC
    document.getElementById("btn-admin-login").onclick = () => {
      const pass = document.getElementById("admin-passcode-input").value.trim();
      if(pass === "254007") {
        document.getElementById("admin-login-sec").classList.add("hidden");
        document.getElementById("admin-dashboard-sec").classList.remove("hidden");
        loadAdminOrders();
        loadAdminProducts();
        loadAdminReports();
      } else {
        alert("❌ Passcode မှားယွင်းနေပါသည်။");
      }
    };

    // TAB SWITCHING LOGIC (4 TABS)
    const tabOrdersBtn = document.getElementById("tab-btn-orders");
    const tabStockBtn = document.getElementById("tab-btn-stock");
    const tabDriveBtn = document.getElementById("tab-btn-drive");
    const tabReportBtn = document.getElementById("tab-btn-report");

    const secOrders = document.getElementById("tab-sec-orders");
    const secStock = document.getElementById("tab-sec-stock");
    const secDrive = document.getElementById("tab-sec-drive");
    const secReport = document.getElementById("tab-sec-report");

    tabOrdersBtn.onclick = () => {
      resetTabActive(); tabOrdersBtn.classList.add("active"); secOrders.classList.remove("hidden");
    };
    tabStockBtn.onclick = () => {
      resetTabActive(); tabStockBtn.classList.add("active"); secStock.classList.remove("hidden");
    };
    tabDriveBtn.onclick = () => {
      resetTabActive(); tabDriveBtn.classList.add("active"); secDrive.classList.remove("hidden");
    };
    tabReportBtn.onclick = () => {
      resetTabActive(); tabReportBtn.classList.add("active"); secReport.classList.remove("hidden");
    };

    function resetTabActive() {
      [tabOrdersBtn, tabStockBtn, tabDriveBtn, tabReportBtn].forEach(b => b.classList.remove("active"));
      [secOrders, secStock, secDrive, secReport].forEach(s => s.classList.add("hidden"));
    }

    // 1. ORDERS LOGIC
    async function loadAdminOrders() {
      const container = document.getElementById("admin-orders-list");
      container.innerHTML = "Loading...";
      const snapshot = await getDocs(collection(db, "orders"));
      container.innerHTML = "";

      if(snapshot.empty) {
        container.innerHTML = "<p style='color:var(--text-sub); text-align:center;'>Order မရှိသေးပါ။</p>";
        return;
      }

      snapshot.forEach(docSnap => {
        const order = docSnap.data();
        const docId = docSnap.id;

        const card = document.createElement("div");
        card.style.background = "#faf5ff";
        card.style.padding = "14px";
        card.style.borderRadius = "16px";
        card.style.marginBottom = "12px";
        card.style.border = "1px solid #e9d5ff";
        
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
            <b style="color:var(--purple-primary);">${order.orderCode}</b>
            <button class="btn-danger" id="del-ord-${docId}">🗑️ ဖျက်မည်</button>
          </div>
          <p style="font-size:0.85rem;"><b>အမည်:</b> ${order.customerName} | <b>ဖုန်း:</b> ${order.phone || 'N/A'}</p>
          <p style="font-size:0.85rem;"><b>ပစ္စည်း:</b> ${order.item} (${order.qty || 1}ခု) | <b>ကျသင့်ငွေ:</b> ${order.totalAmount || 0} Ks</p>
          <p style="font-size:0.85rem;"><b>Note:</b> ${order.note || 'မရှိပါ'}</p>
          <p style="font-size:0.85rem; margin-bottom:8px;"><b>Pay Slip:</b> ${order.paymentScreenshot && order.paymentScreenshot !== 'N/A' ? `<a href="${order.paymentScreenshot}" target="_blank">ကြည့်ရန်</a>` : 'မရှိပါ'}</p>
          
          <select id="status-sel-${docId}" class="input-modern" style="padding:8px; font-size:0.85rem; margin-bottom:6px;">
            <option value="order စစ်ဆေးနေဆဲ" ${order.status === "order စစ်ဆေးနေဆဲ" ? "selected" : ""}>order စစ်ဆေးနေဆဲ</option>
            <option value="order လုပ်ဆောင်နေပါသည်" ${order.status === "order လုပ်ဆောင်နေပါသည်" ? "selected" : ""}>order လုပ်ဆောင်နေပါသည်</option>
            <option value="order rejected" ${order.status === "order rejected" ? "selected" : ""}>order rejected</option>
            <option value="order completed" ${order.status === "order completed" ? "selected" : ""}>order completed</option>
            <option value="order ပို့ဆောင်နေပါသည်" ${order.status === "order ပို့ဆောင်နေပါသည်" ? "selected" : ""}>order ပို့ဆောင်နေပါသည်</option>
          </select>
          <button class="btn-primary" style="padding:10px; font-size:0.85rem;" id="save-ord-${docId}">Status ပြင်ဆင်ချက် သိမ်းမည်</button>
        `;
        container.appendChild(card);

        document.getElementById(`save-ord-${docId}`).onclick = async () => {
          const selValue = document.getElementById(`status-sel-${docId}`).value;
          await updateDoc(doc(db, "orders", docId), { status: selValue });
          alert("Status ပြင်ဆင်ပြီးပါပြီ!");
        };

        document.getElementById(`del-ord-${docId}`).onclick = async () => {
          if(confirm("ဤ Order ကို ဖျက်ရန် သေချာပါသလား?")) {
            await deleteDoc(doc(db, "orders", docId));
            alert("Order ဖျက်ပြီးပါပြီ!");
            loadAdminOrders();
          }
        };
      });
    }

    document.getElementById("btn-reset-all-orders").onclick = async () => {
      if(confirm("⚠️ Order များ အားလုံးကို အပြီးတိုင် ဖျက်ပစ်ပါမည်။ သေချာပါသလား?")) {
        const snapshot = await getDocs(collection(db, "orders"));
        snapshot.forEach(async (docSnap) => {
          await deleteDoc(doc(db, "orders", docSnap.id));
        });
        alert("Order များ အားလုံး Reset ချပြီးပါပြီ!");
        loadAdminOrders();
      }
    };

    // 2. STOCK LOGIC
    async function loadAdminProducts() {
      const container = document.getElementById("admin-products-list");
      container.innerHTML = "Loading...";
      const snapshot = await getDocs(collection(db, "products"));
      container.innerHTML = "";

      if(snapshot.empty) {
        container.innerHTML = "<p style='color:var(--text-sub); text-align:center;'>Stock မရှိသေးပါ။</p>";
        return;
      }

      snapshot.forEach(docSnap => {
        const p = docSnap.data();
        const docId = docSnap.id;

        const card = document.createElement("div");
        card.style.display = "flex";
        card.style.alignItems = "center";
        card.style.justifyContent = "space-between";
        card.style.background = "#faf5ff";
        card.style.padding = "10px 14px";
        card.style.borderRadius = "16px";
        card.style.marginBottom = "10px";
        card.style.border = "1px solid #e9d5ff";

        card.innerHTML = `
          <div style="display:flex; align-items:center; gap:10px;">
            <img src="${p.showPhoto}" style="width:45px; height:45px; border-radius:10px; object-fit:cover;">
            <div>
              <b style="font-size:0.9rem;">${p.name}</b>
              <p style="font-size:0.8rem; color:var(--purple-primary); font-weight:700;">${p.price} Ks</p>
            </div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn-warning" id="edit-prod-${docId}">✏️ Edit</button>
            <button class="btn-danger" id="del-prod-${docId}">🗑️ ဖျက်မည်</button>
          </div>
        `;
        container.appendChild(card);

        document.getElementById(`edit-prod-${docId}`).onclick = () => {
          document.getElementById("p-edit-id").value = docId;
          document.getElementById("p-name").value = p.name;
          document.getElementById("p-price").value = p.price;
          document.getElementById("p-show-img").value = p.showPhoto;
          document.getElementById("p-detail-imgs").value = (p.detailPhotos||[]).join(',');
          document.getElementById("btn-save-product").innerText = "✨ ပြင်ဆင်ချက်အား သိမ်းမည် ➔";
          document.getElementById("btn-cancel-edit").classList.remove("hidden");
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        document.getElementById(`del-prod-${docId}`).onclick = async () => {
          if(confirm("ဤ ပစ္စည်းကို Stock ထဲမှ ဖျက်ရန် သေချာပါသလား?")) {
            await deleteDoc(doc(db, "products", docId));
            alert("ပစ္စည်း ဖျက်ပြီးပါပြီ!");
            loadAdminProducts();
          }
        };
      });
    }

    document.getElementById("btn-save-product").onclick = async () => {
      const editId = document.getElementById("p-edit-id").value;
      const name = document.getElementById("p-name").value;
      const price = Number(document.getElementById("p-price").value);
      const showPhoto = document.getElementById("p-show-img").value;
      const detailPhotos = document.getElementById("p-detail-imgs").value.split(",");

      if(!name || !price || !showPhoto) return alert("အချက်အလက် အပြည့်အစုံ ဖြည့်ပါ။");

      if(editId) {
        await updateDoc(doc(db, "products", editId), { name, price, showPhoto, detailPhotos });
        alert("ပစ္စည်း ပြင်ဆင်ပြီးပါပြီ!");
      } else {
        await addDoc(collection(db, "products"), { name, price, showPhoto, detailPhotos });
        alert("ပစ္စည်းအသစ် တင်ပြီးပါပြီ!");
      }

      resetProductForm();
      loadAdminProducts();
    };

    function resetProductForm() {
      document.getElementById("p-edit-id").value = "";
      document.getElementById("p-name").value = "";
      document.getElementById("p-price").value = "";
      document.getElementById("p-show-img").value = "";
      document.getElementById("p-detail-imgs").value = "";
      document.getElementById("btn-save-product").innerText = "ပစ္စည်း တင်မည် / သိမ်းဆည်းမည် ➔";
      document.getElementById("btn-cancel-edit").classList.add("hidden");
    }

    document.getElementById("btn-cancel-edit").onclick = resetProductForm;

    document.getElementById("btn-reset-all-stock").onclick = async () => {
      if(confirm("⚠️ Stock ထဲမှ ပစ္စည်းများ အားလုံးကို အပြီးတိုင် ဖျက်ပစ်ပါမည်။ သေချာပါသလား?")) {
        const snapshot = await getDocs(collection(db, "products"));
        snapshot.forEach(async (docSnap) => {
          await deleteDoc(doc(db, "products", docSnap.id));
        });
        alert("Stock အားလုံး Reset ချပြီးပါပြီ!");
        loadAdminProducts();
      }
    };

    // 3. GOOGLE DRIVE CHANGER LOGIC
    function convertDriveLink(url) {
      if (!url) return "";
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}`;
      }
      return url.trim();
    }

    document.getElementById("btn-generate-drive").onclick = () => {
      const showRaw = document.getElementById("drive-show-input").value;
      const d1Raw = document.getElementById("drive-detail-1").value;
      const d2Raw = document.getElementById("drive-detail-2").value;
      const d3Raw = document.getElementById("drive-detail-3").value;

      const showDirect = convertDriveLink(showRaw);
      
      const detailDirects = [];
      if (d1Raw) detailDirects.push(convertDriveLink(d1Raw));
      if (d2Raw) detailDirects.push(convertDriveLink(d2Raw));
      if (d3Raw) detailDirects.push(convertDriveLink(d3Raw));

      document.getElementById("out-show-link").value = showDirect;
      document.getElementById("out-detail-links").value = detailDirects.join(",");

      document.getElementById("drive-output-sec").classList.remove("hidden");
    };

    document.getElementById("btn-copy-show").onclick = () => {
      const input = document.getElementById("out-show-link");
      input.select();
      navigator.clipboard.writeText(input.value);
      alert("📋 Show Photo Link ကို Copy ကူးပြီးပါပြီ!");
    };

    document.getElementById("btn-copy-detail").onclick = () => {
      const input = document.getElementById("out-detail-links");
      input.select();
      navigator.clipboard.writeText(input.value);
      alert("📋 Detail Photo Links (Comma ခံလျက်) ကို Copy ကူးပြီးပါပြီ!");
    };

    // 4. REPORTS LOGIC (NEW)
    async function loadAdminReports() {
      const container = document.getElementById("admin-reports-list");
      container.innerHTML = "Loading...";
      const snapshot = await getDocs(collection(db, "reports"));
      container.innerHTML = "";

      if(snapshot.empty) {
        container.innerHTML = "<p style='color:var(--text-sub); text-align:center;'>တိုင်ကြားချက် Report မရှိသေးပါ။</p>";
        return;
      }

      snapshot.forEach(docSnap => {
        const r = docSnap.data();
        const docId = docSnap.id;

        const card = document.createElement("div");
        card.className = "report-card";
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
            <b style="color:#e11d48;">${r.reportCode || 'RP-0000'}</b>
            <button class="btn-danger" id="del-rep-${docId}">🗑️ ဖျက်မည်</button>
          </div>
          <p style="font-size:0.85rem; margin-bottom:6px;"><b>အကြောင်းအရာ:</b> ${r.message || 'မရှိပါ'}</p>
          <select id="rep-status-${docId}" class="input-modern" style="padding:8px; font-size:0.85rem; margin-bottom:6px;">
            <option value="စစ်ဆေးနေဆဲ" ${r.status === "စစ်ဆေးနေဆဲ" ? "selected" : ""}>စစ်ဆေးနေဆဲ</option>
            <option value="အရေးယူဆောင်ရွက်ပြီး" ${r.status === "အရေးယူဆောင်ရွက်ပြီး" ? "selected" : ""}>အရေးယူဆောင်ရွက်ပြီး</option>
            <option value="ပယ်ဖျက်လိုက်သည်" ${r.status === "ပယ်ဖျက်လိုက်သည်" ? "selected" : ""}>ပယ်ဖျက်လိုက်သည်</option>
          </select>
          <button class="btn-primary" style="padding:8px; font-size:0.85rem; background:#8b5cf6;" id="save-rep-${docId}">Status ပြင်ဆင်ချက် သိမ်းမည်</button>
        `;
        container.appendChild(card);

        document.getElementById(`save-rep-${docId}`).onclick = async () => {
          const val = document.getElementById(`rep-status-${docId}`).value;
          await updateDoc(doc(db, "reports", docId), { status: val });
          alert("Report Status ပြင်ဆင်ပြီးပါပြီ!");
        };

        document.getElementById(`del-rep-${docId}`).onclick = async () => {
          if(confirm("ဤ Report ကို ဖျက်ရန် သေချာပါသလား?")) {
            await deleteDoc(doc(db, "reports", docId));
            alert("Report ဖျက်ပြီးပါပြီ!");
            loadAdminReports();
          }
        };
      });
    }
  </script>
</body>
</html>
